<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Happy birthday 🎉</title>
  <style>
    body {
      background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a6c1ee);
      background-size: 800% 800%;
      animation: gradientBG 15s ease infinite;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
    }

    @keyframes gradientBG {
      0% {background-position:0% 50%;}
      50% {background-position:100% 50%;}
      100% {background-position:0% 50%;}
    }

  .confetti {
    position: fixed;
    top: -10px;
    width: 10px;
    height: 10px;
    opacity: 0.8;
    border-radius: 50%;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to {
      transform: translateY(100vh) rotate(360deg);
      opacity: 0;
    }
  }


    h1 {
      color: #fff;
      font-size: 3em;
      text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4, 0 0 30px #ff1493;
      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #ff69b4; }
      to { text-shadow: 0 0 20px #fff, 0 0 40px #ff1493; }
    }

    p {
      color: #333;
      font-size: 1.5em;
      margin-top: 20px;
    }

    img {
      margin-top: 30px;
      max-width: 400px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
      transition: transform 0.5s ease;
    }
    img:hover {
      transform: scale(1.05);
    }

    .heart {
      font-size: 5em;
      color: red;
      animation: pulse 1s infinite, rotate 6s linear infinite;
      display: inline-block;
      margin-top: 20px;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    audio {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Happy birthday Mpeleeeeee🎉</h1>
  <p>Que cette journée soit remplie de joie et de surprises ✨</p>
  <div class="heart">🎉</div>
  <img src="IMG_20260922_004522.jpg" alt="Photo spéciale">

  <!-- Vidéo utilisée comme audio -->
  <audio controls autoplay loop>
    <source src="WhatsApp Video 2026-07-08 at 20.33.31.mp4" type="audio/mp4">
    Ton navigateur ne supporte pas la vidéo/audio.
  </audio>

  <!-- Musique -->
  <audio controls autoplay loop>
    <source src="musique.mp3" type="audio/mpeg">
    Ton navigateur ne supporte pas l'audio.
  </audio>
  <script>
  function createConfetti() {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.left = Math.random() * window.innerWidth + "px";
    confetti.style.animationDuration = (Math.random() * 3 + 2) + "s";
    confetti.style.backgroundColor = ["#ff0", "#f0f", "#0ff", "#0f0", "#f00", "#00f"][Math.floor(Math.random() * 6)];
    document.body.appendChild(confetti);

    setTimeout(() => {
      confetti.remove();
    }, 5000);
  }

  setInterval(createConfetti, 200);
</script>
</body>
</html>
